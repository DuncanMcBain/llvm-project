name: lldb step over fails

on:
  push:
  workflow_dispatch:

jobs:
  test-macos:
    name: Test ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: arm64
            os: macos-14
            targets: "AArch64"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          brew install ninja cmake swig coreutils
          python3 -m venv ~/lldb-venv
          ~/lldb-venv/bin/pip install packaging psutil

      - name: Restore build cache
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-${{ matrix.arch }}-build-${{ hashFiles('llvm/CMakeLists.txt', 'llvm/cmake/**', 'clang/CMakeLists.txt', 'lldb/CMakeLists.txt', 'compiler-rt/CMakeLists.txt', 'libcxx/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-build-

      - name: Configure
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          source ~/lldb-venv/bin/activate
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_PROJECTS="clang;lldb" \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt;libcxx;libcxxabi;libunwind" \
            -DLLVM_TARGETS_TO_BUILD="${{ matrix.targets }}" \
            -DLLVM_HOST_TRIPLE="${{ matrix.arch }}-apple-macosx" \

      - name: Build
        run: |
          source ~/lldb-venv/bin/activate
          ninja -C build lldb debugserver clang FileCheck dsymutil count not llvm-config

      - name: Diagnostic info
        run: |
          echo "=== macOS version ==="
          sw_vers
          echo ""
          echo "=== Xcode version ==="
          xcodebuild -version 2>&1 || true
          echo ""
          echo "=== Built debugserver code-signing ==="
          codesign -dvv ./build/bin/debugserver 2>&1 || true
          echo "--- entitlements ---"
          codesign -d --entitlements - ./build/bin/debugserver 2>&1 || true
          echo ""
          echo "=== System debugserver ==="
          XCODE_DS="$(xcode-select -p)/../SharedFrameworks/LLDB.framework/Versions/A/Resources/debugserver"
          if [ -f "$XCODE_DS" ]; then
            codesign -dvv "$XCODE_DS" 2>&1 || true
            echo "--- entitlements ---"
            codesign -d --entitlements - "$XCODE_DS" 2>&1 || true
          else
            echo "Xcode debugserver not found at $XCODE_DS"
          fi
          echo ""
          echo "=== SIP status ==="
          csrutil status 2>&1 || true
          echo ""
          echo "=== Developer mode ==="
          DevToolsSecurity -status 2>&1 || true

      - name: Compile test binaries
        run: |
          SDK=$(xcrun --show-sdk-path)

          cat > /tmp/test_no_trap.c << 'CEOF'
          int global = 0;
          int main() {
            global = 5;
            global = 10;
            return 0;
          }
          CEOF
          ./build/bin/clang -g -O0 -isysroot "$SDK" -o /tmp/test_no_trap /tmp/test_no_trap.c

          cat > /tmp/test_minimal.c << 'CEOF'
          int main() {
            __builtin_debugtrap();
            return 0;
          }
          CEOF
          ./build/bin/clang -g -O0 -isysroot "$SDK" -o /tmp/test_minimal /tmp/test_minimal.c

          ./build/bin/clang++ -g -isysroot "$SDK" -o /tmp/test_expr_side_effect \
            lldb/test/Shell/Expr/TestExprWithSideEffect.cpp

          echo "All test binaries compiled OK"

      # Every test uses a background process + watchdog pattern so output
      # streams in real time and hangs are caught with a 60s timeout.

      - name: "Test: regular breakpoint (no trap)"
        if: always()
        timeout-minutes: 2
        run: |
          LOG=/tmp/log-no-trap
          echo "=== Regular breakpoint test ==="
          ./build/bin/lldb --no-lldbinit /tmp/test_no_trap \
            -o "log enable lldb process event host -f ${LOG}-process.log" \
            -o "log enable gdb-remote packets -f ${LOG}-gdb.log" \
            -o "b main" \
            -o "run" \
            -o "p global" \
            -o "continue" \
            -o "exit" &
          PID=$!
          (
            sleep 60
            if kill -0 $PID 2>/dev/null; then
              echo "HANG DETECTED (regular breakpoint)"
              echo "=== Process log ===" && cat ${LOG}-process.log 2>/dev/null || true
              echo "=== GDB log (last 50) ===" && tail -50 ${LOG}-gdb.log 2>/dev/null || true
              for p in lldb debugserver; do
                pgrep -x $p | while read pid; do
                  echo "--- sample $p $pid ---" && gtimeout 5 sample $pid 1 2>&1 || true
                done
              done
              kill $PID 2>/dev/null
            fi
          ) &
          W=$!; wait $PID; RC=$?; kill $W 2>/dev/null; wait $W 2>/dev/null
          echo "=== Exit code: $RC ==="
          cat ${LOG}-process.log 2>/dev/null || true

      - name: "Test: minimal trap (run + exit)"
        if: always()
        timeout-minutes: 2
        run: |
          LOG=/tmp/log-minimal
          echo "=== Minimal trap test ==="
          ./build/bin/lldb --no-lldbinit /tmp/test_minimal \
            -o "log enable lldb process event host -f ${LOG}-process.log" \
            -o "log enable gdb-remote packets -f ${LOG}-gdb.log" \
            -o "run" \
            -o "bt" \
            -o "exit" &
          PID=$!
          (
            sleep 60
            if kill -0 $PID 2>/dev/null; then
              echo "HANG DETECTED (minimal trap)"
              echo "=== Process log ===" && cat ${LOG}-process.log 2>/dev/null || true
              echo "=== GDB log (last 50) ===" && tail -50 ${LOG}-gdb.log 2>/dev/null || true
              for p in lldb debugserver; do
                pgrep -x $p | while read pid; do
                  echo "--- sample $p $pid ---" && gtimeout 5 sample $pid 1 2>&1 || true
                done
              done
              kill $PID 2>/dev/null
            fi
          ) &
          W=$!; wait $PID; RC=$?; kill $W 2>/dev/null; wait $W 2>/dev/null
          echo "=== Exit code: $RC ==="
          cat ${LOG}-process.log 2>/dev/null || true

      - name: "Test: full expr test with logging"
        if: always()
        timeout-minutes: 2
        run: |
          LOGFILE=/tmp/lldb-process.log
          GDB_LOG=/tmp/lldb-gdb-remote.log

          echo "=== Full expr test with logging ==="
          ./build/bin/lldb --no-lldbinit /tmp/test_expr_side_effect \
            -o "log enable lldb process event -f $LOGFILE" \
            -o "log enable gdb-remote packets -f $GDB_LOG" \
            -o "run" \
            -o "frame variable x" \
            -o "expr x.inc()" \
            -o "frame variable x" \
            -o "continue" \
            -o "frame variable x" \
            -o "exit" &
          PID=$!

          (
            sleep 60
            if kill -0 "$PID" 2>/dev/null; then
              echo ""
              echo "========================================="
              echo "=== HANG DETECTED after 60s ==="
              echo "========================================="

              echo "=== Process log ==="
              cat "$LOGFILE" 2>/dev/null || echo "(none)"
              echo ""
              echo "=== GDB remote log (last 100 lines) ==="
              tail -100 "$GDB_LOG" 2>/dev/null || echo "(none)"
              echo ""

              for proc in lldb debugserver; do
                pgrep -x "$proc" | while read -r pid; do
                  echo "--- sample $proc PID $pid ---"
                  gtimeout 5 sample "$pid" 1 2>&1 || true
                done
              done

              kill $PID 2>/dev/null
            fi
          ) &
          W=$!

          wait $PID
          RC=$?
          kill $W 2>/dev/null
          wait $W 2>/dev/null

          echo ""
          echo "=== Exit code: $RC ==="
          echo "=== Process log ==="
          cat "$LOGFILE" 2>/dev/null || echo "(none)"
          echo "=== GDB remote log (last 50 lines) ==="
          tail -50 "$GDB_LOG" 2>/dev/null || echo "(none)"

      - name: "Test: with PerformAction disabled"
        if: always()
        timeout-minutes: 5
        run: |
          echo "=== Disabling PerformAction ==="

          sed -i '' '/^void StopInfoMachException::PerformAction/,/^}/d' \
            lldb/source/Plugins/Process/Utility/StopInfoMachException.cpp

          sed -i '' '/Allow this plugin to respond/,/PerformAction.*override;/d' \
            lldb/source/Plugins/Process/Utility/StopInfoMachException.h

          python3 -c "
          import re
          with open('lldb/source/Target/StopInfo.cpp') as f:
              s = f.read()
          s = re.sub(
              r'  void PerformAction\(\[\[maybe_unused\]\].*?SkipOverTrapInstruction\(\);.*?\n  \}\n',
              '', s, count=1, flags=re.DOTALL)
          with open('lldb/source/Target/StopInfo.cpp', 'w') as f:
              f.write(s)
          "

          source ~/lldb-venv/bin/activate
          ninja -C build lldb

          if [ ! -f /tmp/test_expr_side_effect ]; then
            echo "FAIL: test binary not found (compile step failed)"
            exit 1
          fi

          LOG=/tmp/log-no-performaction
          echo "=== Running test with PerformAction disabled ==="
          ./build/bin/lldb --no-lldbinit /tmp/test_expr_side_effect \
            -o "log enable lldb process event host -f ${LOG}-process.log" \
            -o "log enable gdb-remote packets -f ${LOG}-gdb.log" \
            -o "run" \
            -o "frame variable x" \
            -o "continue" \
            -o "frame variable x" \
            -o "continue" \
            -o "exit" &
          PID=$!
          (
            sleep 60
            if kill -0 "$PID" 2>/dev/null; then
              echo "=== HANG with PerformAction DISABLED ==="
              echo "Conclusion: Platform.cpp refactoring causes the hang."
              echo "=== Process log ===" && cat ${LOG}-process.log 2>/dev/null || true
              echo "=== GDB log (last 50) ===" && tail -50 ${LOG}-gdb.log 2>/dev/null || true
              kill $PID 2>/dev/null
            fi
          ) &
          W=$!; wait $PID; RC=$?; kill $W 2>/dev/null; wait $W 2>/dev/null

          echo "=== Exit code: $RC ==="
          cat ${LOG}-process.log 2>/dev/null || true
          if [ $RC -eq 0 ]; then
            echo "PASS: No hang with PerformAction disabled."
            echo "Conclusion: the hang requires PerformAction (ReadMemory during event processing)."
          fi

      - name: Run original lit tests
        if: always()
        timeout-minutes: 5
        run: |
          source ~/lldb-venv/bin/activate

          run_with_timeout() {
            local test=$1
            echo "=== Running: $test ==="
            gtimeout 60 ./build/bin/llvm-lit -v --timeout 40 "$test" 2>&1 || true
          }

          if [ "${{ matrix.arch }}" == "arm64" ]; then
            run_with_timeout lldb/test/Shell/Expr/TestExprWithSideEffect.cpp
            run_with_timeout lldb/test/Shell/Expr/TestExprWithSideEffectOnConvenienceVar.cpp
          else
            ./build/bin/lldb-dotest -v lldb/test/API/functionalities/builtin-debugtrap
          fi
