name: lldb step over fails

on:
  push:
  workflow_dispatch:

jobs:
  test-macos:
    name: Test ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: macos-15-intel
            targets: "X86"
          - arch: arm64
            os: macos-14
            targets: "AArch64"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          brew install ninja cmake swig coreutils
          python3 -m venv ~/lldb-venv
          ~/lldb-venv/bin/pip install packaging psutil

      - name: Setup lldb_codesign certificate
        run: |
          # The built debugserver needs a trusted code signing certificate
          # to attach to processes on macOS. Without this, debugserver is
          # adhoc-signed and vAttach hangs because task_for_pid() fails.
          #
          # This creates a self-signed cert in the System keychain, which
          # cmake detects and uses to sign debugserver during the build.
          CERT="lldb_codesign"

          # Check if already present
          if security find-certificate -c "$CERT" /Library/Keychains/System.keychain > /dev/null 2>&1; then
            echo "Certificate '$CERT' already exists"
            exit 0
          fi

          echo "Creating lldb_codesign certificate..."
          TMPDIR="${TMPDIR:-/tmp}"

          # Generate self-signed certificate
          cat > "$TMPDIR/$CERT.tmpl" <<TMPL
          [ req ]
          default_bits       = 2048
          encrypt_key        = no
          default_md         = sha256
          prompt             = no
          distinguished_name = dn
          [ dn ]
          commonName         = lldb_codesign
          [ codesign_reqext ]
          keyUsage           = critical,digitalSignature
          extendedKeyUsage   = critical,codeSigning
          TMPL

          openssl req -new -newkey rsa:2048 -x509 -days 1 \
            -nodes -config "$TMPDIR/$CERT.tmpl" \
            -extensions codesign_reqext -batch \
            -out "$TMPDIR/$CERT.cer" \
            -keyout "$TMPDIR/$CERT.key"

          # Install as trusted in the System keychain
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$TMPDIR/$CERT.cer"

          sudo security import "$TMPDIR/$CERT.key" -A \
            -k /Library/Keychains/System.keychain

          # Restart taskgated to pick up the new cert
          sudo pkill -f /usr/libexec/taskgated || true

          # Verify
          security find-certificate -c "$CERT" /Library/Keychains/System.keychain > /dev/null 2>&1 \
            && echo "Certificate installed successfully" \
            || { echo "FAILED to install certificate"; exit 1; }

          rm -f "$TMPDIR/$CERT.tmpl" "$TMPDIR/$CERT.cer" "$TMPDIR/$CERT.key"

      - name: Restore build cache
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          # Include 'codesign' in cache key so we rebuild with the cert
          key: ${{ runner.os }}-${{ matrix.arch }}-codesigned-build-${{ hashFiles('llvm/CMakeLists.txt', 'llvm/cmake/**', 'clang/CMakeLists.txt', 'lldb/CMakeLists.txt', 'compiler-rt/CMakeLists.txt', 'libcxx/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-codesigned-build-

      - name: Configure
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          source ~/lldb-venv/bin/activate
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_PROJECTS="clang;lldb" \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt;libcxx;libcxxabi;libunwind" \
            -DLLVM_TARGETS_TO_BUILD="${{ matrix.targets }}" \
            -DLLVM_HOST_TRIPLE="${{ matrix.arch }}-apple-macosx" \

      - name: Build
        run: |
          source ~/lldb-venv/bin/activate
          ninja -C build lldb debugserver clang FileCheck dsymutil count not llvm-config

      - name: Re-sign debugserver
        run: |
          # If cmake didn't detect the cert (cache hit from before cert
          # was installed), re-sign debugserver now.
          echo "=== Current debugserver signing ==="
          codesign -dvv ./build/bin/debugserver 2>&1 || true
          codesign -d --entitlements - ./build/bin/debugserver 2>&1 || true

          # Re-sign with lldb_codesign and the private macOS entitlements.
          # The public entitlement (com.apple.security.cs.debugger) alone is
          # not sufficient for task_for_pid() on GH Actions VMs. The private
          # entitlements (com.apple.private.cs.debugger, private.set-exception-port,
          # private.thread-set-state) match what the system debugserver has.
          # With SIP disabled, these should be honored even with a self-signed cert.
          ENTITLEMENTS="lldb/tools/debugserver/resources/debugserver-macosx-private-entitlements.plist"
          if security find-certificate -c "lldb_codesign" /Library/Keychains/System.keychain > /dev/null 2>&1; then
            echo ""
            echo "Re-signing debugserver with lldb_codesign certificate..."
            codesign -f -s "lldb_codesign" --entitlements "$ENTITLEMENTS" ./build/bin/debugserver
            echo ""
            echo "=== After re-signing ==="
            codesign -dvv ./build/bin/debugserver 2>&1 || true
            codesign -d --entitlements - ./build/bin/debugserver 2>&1 || true
          else
            echo "WARNING: lldb_codesign certificate not found, debugserver remains adhoc-signed"
          fi

      - name: Diagnostic info
        run: |
          echo "=== macOS version ==="
          sw_vers
          echo ""
          echo "=== SIP status ==="
          csrutil status 2>&1 || true
          echo ""
          echo "=== Developer mode ==="
          DevToolsSecurity -status 2>&1 || true

      - name: Compile test binaries
        run: |
          SDK=$(xcrun --show-sdk-path)

          cat > /tmp/test_no_trap.c << 'CEOF'
          int global = 0;
          int main() {
            global = 5;
            global = 10;
            return 0;
          }
          CEOF
          ./build/bin/clang -g -O0 -isysroot "$SDK" -o /tmp/test_no_trap /tmp/test_no_trap.c

          ./build/bin/clang++ -g -isysroot "$SDK" -o /tmp/test_expr_side_effect \
            lldb/test/Shell/Expr/TestExprWithSideEffect.cpp

          echo "All test binaries compiled OK"

      # Quick smoke test: does the re-signed debugserver work at all?
      - name: "Test: regular breakpoint"
        timeout-minutes: 2
        run: |
          echo "=== Regular breakpoint test ==="
          gtimeout 30 ./build/bin/lldb --no-lldbinit /tmp/test_no_trap \
            -o "b main" \
            -o "run" \
            -o "p global" \
            -o "continue" \
            -o "exit" 2>&1
          echo "PASS: regular breakpoint"

      # The actual test that was failing upstream
      - name: "Test: expr with side effect (manual)"
        if: always()
        timeout-minutes: 2
        run: |
          echo "=== Expr side effect test ==="
          gtimeout 30 ./build/bin/lldb --no-lldbinit /tmp/test_expr_side_effect \
            -o "run" \
            -o "frame variable x" \
            -o "expr x.inc()" \
            -o "frame variable x" \
            -o "continue" \
            -o "frame variable x" \
            -o "expr x.i = 10" \
            -o "frame variable x" \
            -o "continue" \
            -o "frame variable x" \
            -o "exit" 2>&1
          echo "PASS: expr side effect"

      # Run the actual upstream lit tests
      - name: Run original lit tests
        if: always()
        timeout-minutes: 5
        run: |
          source ~/lldb-venv/bin/activate

          echo "=== TestExprWithSideEffect ==="
          ./build/bin/llvm-lit -v --timeout 60 \
            lldb/test/Shell/Expr/TestExprWithSideEffect.cpp

          echo ""
          echo "=== TestExprWithSideEffectOnConvenienceVar ==="
          ./build/bin/llvm-lit -v --timeout 60 \
            lldb/test/Shell/Expr/TestExprWithSideEffectOnConvenienceVar.cpp
